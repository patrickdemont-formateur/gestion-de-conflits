<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Gérer les conflits</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317171c'/%3E%3Crect x='5' y='8' width='6' height='16' rx='1.5' fill='%23fff'/%3E%3Crect x='13' y='8' width='6' height='16' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='8' width='6' height='16' rx='1.5' fill='%23fff'/%3E%3Ccircle cx='8' cy='16' r='2' fill='%23d3300d'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23d3300d'/%3E%3Ccircle cx='24' cy='16' r='2' fill='%23d3300d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <a class="icon-btn" id="admin-link" href="#parametres" hidden aria-label="Paramètres de la console" title="Paramètres de la console">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="evenodd" d="M12 4.8a7.2 7.2 0 1 0 0 14.4a7.2 7.2 0 1 0 0-14.4z M12 8.8a3.2 3.2 0 1 0 0 6.4a3.2 3.2 0 1 0 0-6.4z"></path>
            <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="4.2" stroke-dasharray="2.8 3.9544" stroke-dashoffset="1.4" transform="rotate(-90 12 12)"></circle>
          </svg>
        </a>
        <p class="brand">Gérer les conflits</p>
      </div>
      <p class="badge" id="participant-badge" hidden></p>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <noscript>
      <div class="noscript">
        JavaScript est désactivé dans votre navigateur. Cette application en a besoin pour fonctionner :
        activez JavaScript, puis actualisez la page.
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Aucune donnée n’est envoyée vers un serveur : les prénoms, les tirages et vos notes restent uniquement sur cet appareil.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Confirmation</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-secondary" value="cancel" autofocus>Annuler</button>
        <button type="submit" class="btn btn-primary" value="ok" id="confirm-ok">Confirmer</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="qr.js"></script>
  <script src="console.js"></script>
  <script src="app.js"></script>
</body>
</html>
